# nginx server block for php-llm.
#
# Inside the image this runs alongside php-fpm in the SAME container (managed
# by supervisord). fastcgi_pass therefore points at 127.0.0.1:9000, not a
# separate compose service.
#
# Document root is the `web/` directory so that `/` hits web/index.php.
# infer.php sits one directory up and is require()'d by web/index.php — it is
# never directly URL-addressable, which is the safer default.

server {
    listen       80;
    server_name  _;
    root         /var/www/html/web;
    index        index.php;

    # Cap request body — prompts are tiny.
    client_max_body_size 64k;

    # Pretty URL: fall back to index.php so /?prompt=... works from any path.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Hand all PHP files to the local php-fpm fastcgi upstream.
    location ~ \.php$ {
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        # Long generation needs a generous timeout.
        fastcgi_read_timeout 120s;
    }

    # Never serve dotfiles or weight binaries directly.
    location ~ /\.(?!well-known) { deny all; }
    location ~ \.bin$            { deny all; }
}
