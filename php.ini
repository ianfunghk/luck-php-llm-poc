; php.ini overrides for php-llm.
; Drop into /usr/local/etc/php/conf.d/ inside the php-fpm container.

; The whole point of this project is to fit a real (tiny) LLM forward pass
; inside a shared-hosting 1 GB ceiling. Allow the full gig.
memory_limit = 1024M

; Generation takes a few seconds; set a generous wall clock.
max_execution_time = 120

; Surface errors during development. On real shared hosting you may want
; display_errors=Off and log_errors=On instead.
display_errors = On
error_reporting = E_ALL

; OPcache helps the web entry point; CLI runs disable it by default.
opcache.enable = 1
opcache.enable_cli = 0

; Realpath cache (helps the per-tensor fopen storm in src/Loader.php).
realpath_cache_size = 4096K
realpath_cache_ttl = 600
